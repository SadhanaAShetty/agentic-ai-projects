
[project]
name = "agentic-ai-projects"
version = "0.1.0"
description = "A collection of agentic AI projects and MCP implementations"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "SadhanaAShetty" }
]
dependencies = [
    "fastmcp==4.2.0",
    "mcp[cli]>=2.3.0",
    "requests>=2.34.2",
]

[project.scripts]
agentic-ai-projects = "agentic_ai_projects:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
